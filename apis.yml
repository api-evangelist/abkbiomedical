aid: abkbiomedical
name: ABK Biomedical
description: ABK Biomedical Inc. is a Halifax, Nova Scotia medical device company founded in 2012 as a spin-out
  of Dalhousie University, developing and manufacturing imageable embolic microspheres for interventional oncology.
  Its lead product, Eye90 microspheres, is a yttrium-90 radioembolization device built on a proprietary imageable
  glass composition that is directly visible under fluoroscopy, X-ray and CT during and after the procedure, and
  it was granted FDA Breakthrough Device Designation for unresectable hepatocellular carcinoma and studied in the
  ROUTE90 pivotal trial. Its Easi-Vue embolic microspheres received FDA 510(k) clearance for embolization of
  hypervascular tumors and arteriovenous malformations. Devices are produced in the company's own cleanroom
  manufacturing facility in Halifax, with a second office in Ladera Ranch, California. ABK Biomedical is a
  regulated medical device manufacturer rather than a software vendor, and as of this profile it publishes no
  developer program, API documentation, SDK, or machine-readable API contract of any kind.
